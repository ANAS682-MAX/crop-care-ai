name: crop_disease_app
description: AI-Based Crop Disease Detection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Camera & Image
  camera: ^0.10.5
  image_picker: ^1.0.4
  image: ^4.1.3

  # AI / ML
  http: ^1.1.0

  # Storage & State
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1

  # Location
  geolocator: ^10.1.0

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  lottie: ^2.7.0

  # Utils
  connectivity_plus: ^5.0.2
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/models/
    - assets/labels/
